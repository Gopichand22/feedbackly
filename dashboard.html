<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Feedbackly — Dashboard</title>
<style>
  body{margin:0;font:15px system-ui,sans-serif;background:#f6f7fb;color:#111}
  header{background:#4f46e5;color:#fff;padding:18px 24px}
  header h1{margin:0;font-size:20px}
  header p{margin:4px 0 0;opacity:.85;font-size:13px}
  .wrap{max-width:760px;margin:24px auto;padding:0 16px}
  .bar{display:flex;gap:8px;align-items:center;margin-bottom:16px}
  .bar input{flex:1;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px}
  .bar button{padding:10px 16px;background:#4f46e5;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600}
  .card{background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .card .msg{font-size:15px;margin:0 0 6px}
  .card .meta{font-size:12px;color:#888}
  .empty{text-align:center;color:#999;padding:40px}
  .count{font-size:13px;color:#666;margin-bottom:10px}
</style>
</head>
<body>
<header>
  <h1>💬 Feedbackly</h1>
  <p>Your feedback dashboard — see what your users are saying.</p>
</header>
<div class="wrap">
  <div class="bar">
    <input id="project" value="demo" placeholder="project id" />
    <button onclick="load()">Refresh</button>
  </div>
  <div class="count" id="count"></div>
  <div id="list"><div class="empty">Loading…</div></div>
</div>
<script>
  async function load(){
    const project = document.getElementById('project').value || 'demo';
    const res = await fetch('/api/feedback?project=' + encodeURIComponent(project));
    const items = await res.json();
    const list = document.getElementById('list');
    document.getElementById('count').textContent = items.length + ' feedback message(s)';
    if(!items.length){ list.innerHTML = '<div class="empty">No feedback yet. Open the demo page and send one!</div>'; return; }
    list.innerHTML = items.map(f =>
      '<div class="card"><p class="msg">' + esc(f.message) + '</p>' +
      '<div class="meta">' + new Date(f.createdAt).toLocaleString() +
      (f.pageUrl ? ' • ' + esc(f.pageUrl) : '') + '</div></div>'
    ).join('');
  }
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  load();
  setInterval(load, 4000); // auto-refresh so you see new feedback live
</script>
</body>
</html>
