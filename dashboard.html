<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Feedbackly — Dashboard</title>
<style>
  :root{--indigo:#4f46e5;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--soft:#f8fafc;--bg:#fff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--soft);color:var(--ink)}
  a{color:inherit;text-decoration:none}

  .topbar{background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .topbar .inner{max-width:920px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
  .logo{font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px}
  .logo .dot{width:26px;height:26px;background:var(--indigo);border-radius:7px;display:grid;place-items:center;color:#fff;font-size:15px}
  .topbar a.home{color:var(--muted);font-size:14px;font-weight:500}
  .topbar a.home:hover{color:var(--ink)}

  .wrap{max-width:920px;margin:26px auto;padding:0 20px}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
  @media(max-width:640px){.stats{grid-template-columns:1fr}}
  .stat{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
  .stat .label{color:var(--muted);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .stat .value{font-size:30px;font-weight:800;margin-top:6px}

  .controls{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
  .controls label{font-size:13px;color:var(--muted);font-weight:600}
  .controls input{padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;min-width:180px;outline:none}
  .controls input:focus{border-color:var(--indigo)}
  .controls .btn{padding:10px 16px;background:var(--indigo);color:#fff;border:none;border-radius:10px;font-weight:600;cursor:pointer;font-size:14px}
  .controls .spacer{flex:1}
  .live{font-size:12px;color:#16a34a;font-weight:600;display:flex;align-items:center;gap:6px}
  .live .pulse{width:8px;height:8px;border-radius:50%;background:#16a34a;animation:p 1.4s infinite}
  @keyframes p{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}

  .card{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px;transition:.15s}
  .card:hover{box-shadow:0 6px 18px rgba(15,23,42,.06)}
  .card .msg{font-size:15px;line-height:1.55;margin-bottom:10px;white-space:pre-wrap}
  .card .meta{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .card .meta .url{color:var(--indigo);max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .avatar{width:30px;height:30px;border-radius:50%;background:#eef2ff;color:var(--indigo);font-weight:700;display:inline-grid;place-items:center;font-size:13px;margin-right:6px}
  .row{display:flex;gap:10px;align-items:flex-start}
  .row .body{flex:1}

  .empty{text-align:center;color:var(--muted);padding:60px 20px;background:var(--bg);border:1px dashed var(--line);border-radius:14px}
  .empty .big{font-size:40px;margin-bottom:10px}
</style>
</head>
<body>

<div class="topbar">
  <div class="inner">
    <div class="logo"><span class="dot">💬</span> Feedbackly</div>
    <a class="home" href="/">← Back to site</a>
  </div>
</div>

<div class="wrap">
  <div class="stats">
    <div class="stat"><div class="label">Total feedback</div><div class="value" id="s-total">—</div></div>
    <div class="stat"><div class="label">Last 24 hours</div><div class="value" id="s-today">—</div></div>
    <div class="stat"><div class="label">Project</div><div class="value" id="s-project" style="font-size:20px;padding-top:8px">demo</div></div>
  </div>

  <div class="controls">
    <label>Project ID</label>
    <input id="project" value="demo" placeholder="your-project-id" />
    <button class="btn" onclick="load()">Refresh</button>
    <div class="spacer"></div>
    <div class="live"><span class="pulse"></span> Live · auto-updating</div>
  </div>

  <div id="list"><div class="empty"><div class="big">⏳</div>Loading…</div></div>
</div>

<script>
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function timeAgo(iso){
    const s=Math.floor((Date.now()-new Date(iso))/1000);
    if(s<60)return 'just now';
    if(s<3600)return Math.floor(s/60)+'m ago';
    if(s<86400)return Math.floor(s/3600)+'h ago';
    return Math.floor(s/86400)+'d ago';
  }
  async function load(){
    const project=document.getElementById('project').value||'demo';
    document.getElementById('s-project').textContent=project;
    let items=[];
    try{ items=await (await fetch('/api/feedback?project='+encodeURIComponent(project))).json(); }catch(e){}
    const dayAgo=Date.now()-86400000;
    document.getElementById('s-total').textContent=items.length;
    document.getElementById('s-today').textContent=items.filter(f=>new Date(f.createdAt)>=dayAgo).length;
    const list=document.getElementById('list');
    if(!items.length){
      list.innerHTML='<div class="empty"><div class="big">📭</div>No feedback yet.<br>Open the <a href="/demo" style="color:#4f46e5">demo page</a> and send one to see it appear here.</div>';
      return;
    }
    list.innerHTML=items.map(f=>{
      const url=f.pageUrl?'<span class="url" title="'+esc(f.pageUrl)+'">🔗 '+esc(f.pageUrl)+'</span>':'';
      return '<div class="card"><div class="row"><div class="avatar">'+esc((f.message[0]||'?').toUpperCase())+'</div>'+
        '<div class="body"><div class="msg">'+esc(f.message)+'</div>'+
        '<div class="meta"><span>🕒 '+timeAgo(f.createdAt)+'</span><span>'+new Date(f.createdAt).toLocaleString()+'</span>'+url+'</div>'+
        '</div></div></div>';
    }).join('');
  }
  load();
  setInterval(load,4000);
</script>
</body>
</html>
